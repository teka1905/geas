# Эталонная спецификация OpenAPI 3.0.3 из пары basic/.
#
# Вымышленный домен: workspace / document / label / member.
#
# Файл семантически эквивалентен basic/swagger2.json: те же маршруты
# (префикс /api/v1 здесь вписан прямо в шаблоны путей, а в Swagger 2.0 он вынесен
# в basePath), те же operationId, те же формы запросов и ответов.
#
# Единственное расширение, которого нет в Swagger 2.0, — writeOnly. Оно намеренно
# стоит на свойстве схемы DocumentCreate, которая используется ТОЛЬКО как тело
# запроса: writeOnly вырезает поле из направления response, а в response эта схема
# не встречается, поэтому на контракт флаг не влияет и эквивалентность пары
# сохраняется в обоих направлениях.
openapi: "3.0.3"

info:
  title: Workspace Documents API
  version: "1.0.0"

paths:
  /api/v1/workspaces/{workspaceId}/documents:
    # Параметр уровня Path Item: проверяет слияние с параметрами операции.
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listDocuments
      parameters:
        # Массив в query, повтор ключа: эквивалент collectionFormat=multi.
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [draft, review, published]
        # Массив в query через запятую: эквивалент collectionFormat=csv.
        - name: tags
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
        - name: X-Trace-Id
          in: header
          required: false
          schema:
            type: string
            pattern: "^[0-9a-f]{8}$"
      responses:
        "200":
          description: Страница документов
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPage"
        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentCreate"
      responses:
        "200":
          description: Созданный документ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/workspaces/{workspaceId}/documents/{documentId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteDocument
      responses:
        # Ответ без тела: content отсутствует целиком.
        "204":
          description: Документ удалён
        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    # Общая часть документа: видна и в запросе, и в ответе.
    DocumentBase:
      type: object
      required: [title, slug]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 3
          maxLength: 64
        summary:
          type: string
          nullable: true
          maxLength: 500
        # readOnly: поле вырезается из направления request в обоих диалектах.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        visibility:
          type: string
          enum: [private, workspace, public]
        # Массив скаляров.
        keywords:
          type: array
          items:
            type: string
          maxItems: 10
        # Типизированный additionalProperties: словарь строка → строка.
        labels:
          type: object
          additionalProperties:
            type: string
        owner:
          $ref: "#/components/schemas/Member"
        # Массив объектов.
        sections:
          type: array
          items:
            $ref: "#/components/schemas/Section"

    Member:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [viewer, editor, owner]
        active:
          type: boolean

    Section:
      type: object
      required: [heading]
      properties:
        heading:
          type: string
          maxLength: 200
        position:
          type: integer
          minimum: 0
          maximum: 999
        # Вложенный объект, у которого есть свойство с именем format.
        body:
          type: object
          properties:
            text:
              type: string
            format:
              type: string
              enum: [plain, markdown]

    # allOf, который сливается доказуемо: $ref + inline-объект с непересекающимися
    # свойствами и одинаковой политикой дополнительных ключей.
    Document:
      allOf:
        - $ref: "#/components/schemas/DocumentBase"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
            revision:
              type: integer
              format: int64
              minimum: 1
            score:
              type: number
              format: double
              minimum: 0
              maximum: 1
            archived:
              type: boolean

    # Схема только для тела запроса — здесь живёт writeOnly.
    DocumentCreate:
      allOf:
        - $ref: "#/components/schemas/DocumentBase"
        - type: object
          required: [notifyMembers]
          properties:
            draftSecret:
              type: string
              minLength: 8
              writeOnly: true
            notifyMembers:
              type: boolean

    DocumentPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        total:
          type: integer
          format: int64
          minimum: 0
        nextCursor:
          type: string
          nullable: true
        fillRatio:
          type: number
          minimum: 0
          maximum: 1

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, not_found, conflict]
        message:
          type: string
          minLength: 1
        details:
          type: array
          items:
            type: string
        retryable:
          type: boolean
