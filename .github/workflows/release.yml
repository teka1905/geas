# Публикация в PyPI по опубликованному GitHub Release.
#
# Авторизация — Trusted Publishing (OIDC): PyPI доверяет этому workflow в
# окружении `pypi`, токенов и секретов в репозитории нет. Настройка доверенного
# издателя на PyPI: owner `teka1905`, repository `geas`, workflow `release.yml`,
# environment `pypi`.
#
# Для события `release` GitHub берёт этот файл из коммита, на который указывает
# тег релиза. Публикуется ровно то, что собрано из этого коммита.

name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Версия в pyproject.toml совпадает с тегом релиза
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "тег релиза $GITHUB_REF_NAME, а в pyproject.toml версия $version" >&2
            exit 1
          fi

      - name: Установить build и twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Собрать sdist и wheel
        run: python -m build

      - name: Проверить метаданные дистрибутивов
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/geas
    permissions:
      # Обязательно для Trusted Publishing; выдаётся только этому job.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Опубликовать в PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
