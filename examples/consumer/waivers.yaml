# Waiver'ы примера-потребителя.
#
# Здесь их нет и быть не должно: спецификация примера целиком выражается
# контрактом. Файл существует, потому что manifest на него ссылается, и потому
# что пустой список — это осмысленное состояние проекта: «ничего не ослаблено».
#
# Waiver — всегда временное послабление с владельцем, тикетом и сроком:
#
#   version: 1
#   waivers:
#     - operation: api.createDocument       # ключ операции из manifest
#       direction: response                 # request | response
#       json_pointer: /payload              # contract path, а не JSON Pointer спеки
#       rule: allow_any                     # что именно ослабляем
#       reason: "бэкенд отдаёт свободную форму, схема в работе"
#       owner: documents-team
#       issue: ISSUE-1
#       expires_at: 2099-01-01              # не дальше policies.waiver_max_days
#       expected_source: <sha256 из текста ошибки генерации>
#
# Библиотека сама печатает готовую заготовку waiver'а вместе с ошибкой, поэтому
# руками такой блок обычно не пишут — его копируют из вывода 'update'.
version: 1
waivers: []
